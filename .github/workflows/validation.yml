name: Application validation

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install graphics development packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libglfw3-dev libglew-dev libglm-dev libgl1-mesa-dev libjson-c-dev xvfb

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build --parallel

      - name: Headless numerical tests
        run: ctest --test-dir build --output-on-failure

      - name: Virtual-display framebuffer evidence
        run: xvfb-run -a ./build/AeroDynControlRig --render-check build/render-evidence.ppm

      - name: Upload framebuffer evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aerodyn-render-evidence
          path: build/render-evidence.ppm
          if-no-files-found: error
